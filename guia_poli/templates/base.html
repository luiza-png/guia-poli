{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Guia Poli{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-poli: #1a3766;
      --vermelho-poli: #d92b2b;
      --borda-poli: #e3e8ef;
    }
    body {
      margin: 0;
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--azul-poli);
      background-color: #ffffff;
    }

    /* Cabeçalho (inalterado) */
    .header-poli {
      background-color: #ffffff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }
    .header-poli .brand {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--azul-poli);
      text-decoration: none;
      border-bottom: 3px solid var(--vermelho-poli);
      padding-bottom: 2px;
    }
    .header-poli .nav-link-poli {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--azul-poli);
      text-decoration: none;
      border-bottom: 3px solid var(--vermelho-poli);
      padding-bottom: 2px;
    }

    footer {
      background-color: #ffffff;
      text-align: center;
      padding: 20px 0;
      border-top: 1px solid var(--borda-poli);
    }

    /* Container comum ao hero e aos cards */
    .wrap-poli {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Hero */
    .hero-poli {
      background-color: var(--azul-poli);
      padding: 72px 0 150px;
    }
    .hero-titulo {
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      max-width: 720px;
      margin: 0 0 16px;
    }
    .hero-sub {
      color: #c9d6ee;
      font-size: 1.1rem;
      max-width: 520px;
      margin: 0 0 32px;
    }

    /* Busca */
    .busca-poli {
      display: flex;
      background-color: #ffffff;
      border-radius: 6px;
      overflow: hidden;
    }
    .busca-poli:focus-within {
      box-shadow: 0 0 0 3px rgba(217, 43, 43, 0.45);
    }
    .campo-busca {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      padding: 18px 20px;
      font: inherit;
      font-size: 1rem;
      color: var(--azul-poli);
    }
    .campo-busca::placeholder {
      color: #8a97ad;
      opacity: 1;
    }
    .btn-buscar {
      border: 0;
      background-color: var(--vermelho-poli);
      color: #ffffff;
      font-weight: 700;
      padding: 0 32px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-buscar:hover {
      background-color: #b82222;
    }

    /* Cards da home (3 em cima, 2 embaixo) */
    .cards-poli {
      margin-top: -90px;
      position: relative;
      padding-bottom: 72px;
    }
    .card-poli {
      background-color: #ffffff;
      border: 1px solid var(--borda-poli);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 24px;
      text-align: left;
      text-decoration: none;
      color: var(--azul-poli);
      height: 160px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .card-poli:hover {
      transform: translateY(-4px);
      color: var(--azul-poli);
      border-color: var(--azul-poli);
      box-shadow: 0 10px 24px rgba(26, 55, 102, 0.14);
    }
    .card-poli:focus-visible {
      outline: 3px solid var(--vermelho-poli);
      outline-offset: 2px;
    }
    .card-poli i {
      font-size: 2rem;
      line-height: 1;
    }
    .card-poli span {
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* Páginas internas (info_page.html e mapa.html) herdam o novo visual sem edição */
    section .card {
      border: 1px solid var(--borda-poli);
      border-radius: 8px;
    }
    section .card.shadow-sm {
      box-shadow: none !important;
    }
    section .card .h5 {
      color: var(--azul-poli);
      font-weight: 700;
    }
    section .text-white h1 {
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    @media (max-width: 576px) {
      .hero-poli { padding: 48px 0 120px; }
      .btn-buscar { padding: 0 20px; }
    }
  </style>
</head>
<body>

  <header class="header-poli">
    <a href="/" class="brand d-flex align-items-center" style="text-decoration: none;">
      <img src="{% static 'images/Guia_Poli.svg' %}" alt="Logo" style="height: 75px; margin-right: 2px;">
      Guia Poli
    </a>
    <a href="/" class="nav-link-poli">Início</a>
  </header>

  {% block content %}{% endblock %}

  <footer>
  <div class="d-flex justify-content-center align-items-center">
    <img src="{% static 'images/POLI_logo.png' %}" alt="Logo POLI e UPE" style="height: 70px;">
  </div>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
