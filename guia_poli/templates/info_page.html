{% extends "base.html" %}

{% block content %}
<section class="py-5" style="background-color: var(--azul-poli, #1a3766); min-height: 70vh;">
  <div class="container">
    <div class="text-white mb-5">
      <h1>{{ titulo }}</h1>
      <p class="lead">{{ descricao }}</p>
    </div>

    <div class="row g-4">
      {% for item in itens %}
      <div class="col-12 col-md-6">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="h5">{{ item.titulo }}</h2>
            <p class="mb-0">{{ item.descricao }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <a href="{% url 'home' %}" class="btn btn-light mt-4">
      Voltar para a Home
    </a>
  </div>
</section>
{% endblock %}
